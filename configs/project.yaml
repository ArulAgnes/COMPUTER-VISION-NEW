# ============================================================================
# Computer Vision New — central project configuration
# ----------------------------------------------------------------------------
# All classes, paths, splits, thresholds and training parameters live here.
# Code must read from this file; do not hardcode values in source files.
# Values marked "placeholder" are defaults that later stages will override
# through their own configuration (training, evaluation, augmentation).
# ============================================================================

project:
  name: Computer Vision New
  version: 0.1.0

# Class definitions. Adding/removing classes only requires editing this list.
# Model, annotation and evaluation logic derive num_classes from here.
classes:
  - id: 0
    name: bell
  - id: 1
    name: oillamp

paths:
  # READ-ONLY source of truth for raw images. NEVER written to, renamed,
  # resized or deleted by this application.
  raw_data_dir: "D:/IEEE/100%Project/captured_photos"
  # Everything the application generates lives inside the repository.
  data_dir: data
  manifests_dir: data/manifests
  annotations_dir: data/annotations
  datasets_dir: data/datasets
  versions_dir: data/versions
  augmented_dir: data/augmented
  reports_dir: data/reports
  models_dir: models
  checkpoints_dir: models/checkpoints
  registry_dir: models/registry
  logs_dir: logs
  baseline_file: configs/stage0_baseline.json

image:
  size: 640                # square input size for the detector (Stage 6+)

split:                     # Stage 4 — deterministic original-image split
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  stratified: true

training:                  # Stage 7 — from-scratch training (no pretrained weights)
  epochs: 50
  batch_size: 8
  learning_rate: 0.001
  num_workers: 0
  seed: 42

thresholds:                # inference post-processing
  confidence: 0.25
  nms: 0.45
  iou: 0.50

evaluation:                # Stage 8+ — metrics thresholds
  iou_threshold: 0.50
  # TARGETS are goals, never claims of achieved performance.
  targets:
    map: 0.95
    f1: 0.95

quality:                   # Stage 2 — image quality engine (HEURISTICS, not ground truth)
  min_width: 128           # flag images narrower than this
  min_height: 128          # flag images shorter than this
  blur:
    method: laplacian_variance
    review_threshold: 60.0 # blur_score below this -> blur_review flag
    fail_threshold: 15.0   # blur_score below this -> blur_fail flag
  brightness:
    dark_threshold: 45.0   # mean grayscale below this -> too_dark
    bright_threshold: 210.0 # mean grayscale above this -> too_bright
  aspect_ratio:
    min: 0.4               # width/height outside [min, max] -> extreme_aspect_ratio
    max: 2.5
  status_rules:            # flags -> overall quality_status (FAIL > REVIEW > PASS)
    fail_flags: [decode_failed, blur_fail]
    review_flags:
      - blur_review
      - low_resolution
      - too_dark
      - too_bright
      - extreme_aspect_ratio
      - exact_duplicate
      - suspicious_duplicate

duplicates:                # Stage 2 — duplicate detection methods
  near_duplicate:
    enabled: true
    method: dhash_hamming  # 64-bit difference hash, Hamming distance
    max_hamming_distance: 6

api:                       # CORS for the local frontend dev server
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

augmentation:              # Stage 5 — train-only augmentation
  enabled: false
  seed: 42
